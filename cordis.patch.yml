# dsh-harness-watchdog 的 bundle 补丁。
#
# 声明了 `dsh.bundle.patch` 之后，只要这个包被安装进某个 DSH profile 并出现在
# 该 profile `package.json` 的 `dsh.profile.bundles` 列表里，DSH 就会自动应用
# 下面这一行，不需要手工往 profile 的 cordis.patch.yml 里加东西。
#
# 如果你的 DSH 版本不支持组合包，也可以手工把这两行粘到 profile 的
# cordis.patch.yml 里：
#
#   - insert:
#       - id: harness-watchdog
#         name: dsh-harness-watchdog
#
# 本插件只有宿主半，没有任何浏览器端代码，因此不影响界面。

- insert:
    - id: harness-watchdog
      name: dsh-harness-watchdog
